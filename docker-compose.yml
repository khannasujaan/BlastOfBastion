services:
  db:
    image: postgres:15-alpine
    container_name: bastion_db
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    container_name: bastion_migrate
    volumes:
      - ./backend/internal/database/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy 

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: bastion_seed
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully 
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    # Navigates to backend and runs the standalone script
    command: ["sh", "-c", "cd backend && go run fakePlayers.go"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: bastion_backend
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully 
    environment:
      - RUNNING_IN_DOCKER=true
      - PORT=8080
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bastion_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080

volumes:
  postgres_storage: